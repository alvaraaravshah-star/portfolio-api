<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Standalone Macro Engine Tester</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:20px}
    label{display:block;margin-top:10px}
    select,button{margin-top:6px}
    pre{background:#f6f8fa;padding:12px;border-radius:6px;overflow:auto}
  </style>
</head>
<body>
  <h2>Macro Engine — Standalone Tester</h2>

  <p>This page is self-contained and uses the Render API directly.</p>

  <label>Target date
    <select id="date-select"><option>Loading...</option></select>
  </label>

  <label>Investor type
    <select id="investor-select"><option>Loading...</option></select>
  </label>

  <button id="get-btn">Get Recommendation</button>

  <h3>Result</h3>
  <div id="result-area"><pre>Nothing yet.</pre></div>

  <script>
    // Standalone — change API_BASE if you deploy to a different URL
    const API_BASE = 'https://portfolio-api-27sc.onrender.com';

    async function loadOptions(){
      try{
        const d = await fetch(`${API_BASE}/available-dates`);
        const di = await d.json();
        const ds = document.getElementById('date-select');
        ds.innerHTML='';
        (di.dates||[]).forEach(date=>{ const o=document.createElement('option'); o.value=date; o.textContent=date; ds.appendChild(o)});
      }catch(e){
        console.error(e); document.getElementById('date-select').innerHTML = '<option>Error loading</option>'
      }
      try{
        const r = await fetch(`${API_BASE}/available-investor-types`);
        const ri = await r.json();
        const rs = document.getElementById('investor-select');
        rs.innerHTML='';
        (ri.investor_types||[]).forEach(t=>{ const o=document.createElement('option'); o.value=t; o.textContent=t; rs.appendChild(o)});
      }catch(e){
        console.error(e); document.getElementById('investor-select').innerHTML = '<option>Error loading</option>'
      }
    }

    async function getRecommendation(){
      const date = document.getElementById('date-select').value;
      const investor = document.getElementById('investor-select').value;
      const area = document.getElementById('result-area');
      area.innerHTML = '<pre>Loading...</pre>';
      try{
        const resp = await fetch(`${API_BASE}/recommend`,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({target_date:date,investor_type:investor})
        });
        if(!resp.ok){ area.innerHTML = '<pre>'+await resp.text()+'</pre>'; return; }
        const json = await resp.json();
        area.innerHTML = '<pre>'+JSON.stringify(json,null,2)+'</pre>';
      }catch(e){ area.innerHTML = '<pre>'+e.toString()+'</pre>'; }
    }

    document.getElementById('get-btn').addEventListener('click', getRecommendation);
    window.addEventListener('load', loadOptions);
  </script>
</body>
</html>
