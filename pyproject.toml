[project]
name = "macro-engine-api"
version = "1.0.0"
description = "FastAPI server for macro-based portfolio recommendations"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn==0.27.0",
    "pydantic==2.6.4"
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
